name: Actualizar grafo HITS
on:
  schedule: [{cron: "0 6 * * 1"}]   # cada lunes 06:00 UTC
  workflow_dispatch: {}              # botón manual en la pestaña Actions
permissions:
  contents: write
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install playwright networkx && playwright install --with-deps chromium
      - run: python v2/crawler_playwright.py
        env:
          SEED_URL: ${{ vars.SEED_URL }}   # Settings > Secrets and variables > Actions > Variables
          MAX_PAGES: "80"
      - name: Commit si cambió (Render redespliega solo)
        run: |
          git config user.name "tramiteclaro-bot"; git config user.email "bot@users.noreply.github.com"
          git add backend/data
          git diff --staged --quiet || (git commit -m "Actualiza grafo HITS" && git push)
